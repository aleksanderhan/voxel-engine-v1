<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVO Engine WebGPU</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #d7e8ff;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgb(0 0 0 / 60%);
      font-size: 14px;
      line-height: 1.35;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">Loading WebGPU SVO engine…</div>
  <script type="module">
    const status = document.getElementById("status");

    if (!navigator.gpu) {
      status.textContent = "WebGPU is not available. In Firefox, use a current secure-context build and enable WebGPU if your channel still gates it.";
      throw new Error("navigator.gpu is unavailable");
    }

    import("../pkg/svo_engine.js")
      .then(({ default: init }) => init())
      .then(() => {
        status.textContent = "WASD + mouse to fly. WebGPU running in Firefox.";
        setTimeout(() => status.remove(), 5000);
      })
      .catch((error) => {
        console.error(error);
        status.textContent = `Failed to start: ${error.message ?? error}`;
      });
  </script>
</body>
</html>
