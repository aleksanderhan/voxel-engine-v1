[package]
name = "svo_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "25.0"
wgpu-profiler = "0.23"
pollster = "0.4"
web-time = "1.1"
glam = "0.29"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
